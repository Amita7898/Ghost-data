name: Full-stack tests
on: [push, pull_request]
permissions:
  contents: read
concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python: ['3.12', '3.14']
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements-web-tested.txt
      - run: python -m pip install -r requirements-web-tested.txt
      - run: python -m pip install --no-build-isolation -e '.[web,dev]'
      - run: python -m pytest -q
      - name: Publication candidates and history
        run: python scripts/release_audit.py
      - name: Pinned Python advisory audit
        if: matrix.python == '3.12'
        run: |
          python -m venv /tmp/audit-env
          /tmp/audit-env/bin/pip install pip-audit==2.10.1
          /tmp/audit-env/bin/pip-audit -r requirements-web-tested.txt --no-deps --disable-pip
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-web-tested.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m pip install -r requirements-web-tested.txt
      - run: python -m pip install --no-build-isolation -e '.[web,dev]'
      - run: npm ci --prefix frontend
      - run: npm audit --prefix frontend --omit=dev
      - name: Full advisory report (known moderate development chain documented)
        run: npm audit --prefix frontend --audit-level=high
      - run: npm test --prefix frontend
      - run: npm run build --prefix frontend
      - name: Generated API contract remains current
        run: |
          python scripts/export_openapi.py
          npm run api:types --prefix frontend
          git diff --exit-code -- docs/openapi.json frontend/src/api.generated.ts
      - run: npm exec --prefix frontend -- playwright install --with-deps chromium
      - name: Offline browser integration and accessibility
        shell: bash
        run: |
          set -euo pipefail
          python scripts/start.py --offline > /tmp/ghost-data-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          ready=0
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:8000/api/v1/health; then ready=1; break; fi
            sleep 1
          done
          if [ "$ready" != 1 ]; then cat /tmp/ghost-data-server.log; exit 1; fi
          npm run test:e2e --prefix frontend
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failures
          path: |
            frontend/test-results
            /tmp/ghost-data-server.log
