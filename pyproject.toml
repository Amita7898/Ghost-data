[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ghost-data"
version = "0.5.0"
description = "Local LLM investigations with deterministic deletion-audit validation"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["pydantic>=2.10,<3"]

[project.optional-dependencies]
web = ["fastapi>=0.162,<0.163", "uvicorn>=0.54,<0.55"]
dev = ["pytest>=8,<10", "httpx>=0.28,<0.29", "ruff==0.17.3"]

[project.scripts]
ghost-data = "ghost_data.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.setuptools.package-data]
"ghost_data.agent" = ["prompts/*.txt"]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]
