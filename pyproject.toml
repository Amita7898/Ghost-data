[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ghost-data"
version = "0.3.0"
description = "Local LLM investigations with deterministic deletion-audit validation"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.10,<3"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
ghost-data = "ghost_data.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
